# The Xcode project is generated from this file (xcodegen generate) and never committed.
# New files under a target's source folder are picked up automatically; Info.plist keys and
# entitlements go here too, never in the generated files.
name: __APP__
options:
  bundleIdPrefix: com.gios
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1"
    # Automatic signing for running on your own phone from Xcode; CI signs with match instead.
    DEVELOPMENT_TEAM: J3ZBJXNN9P
    CODE_SIGN_STYLE: Automatic
targets:
  __APP__:
    type: application
    platform: iOS
    sources:
      - path: __APP__
    info:
      path: __APP__/Info.plist
      properties:
        CFBundleDisplayName: __DISPLAY__
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen:
          UIColorName: ""
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: __BUNDLE__
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: NO
  __APP__Tests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: __APP__Tests
    dependencies:
      - target: __APP__
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: __BUNDLE__.tests
schemes:
  __APP__:
    build:
      targets:
        __APP__: all
        __APP__Tests: [test]
    test:
      targets:
        - __APP__Tests
